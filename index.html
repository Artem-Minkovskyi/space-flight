<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b18" />
    <title>Space Flight — Lab 01</title>
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">JAVASCRIPT · LAB 01</p>
          <h1>SPACE FLIGHT</h1>
        </div>

        <div class="status">
          <span class="status-dot"></span>
          SIMULATION ONLINE
        </div>
      </header>

      <section class="game-panel">
        <canvas id="game"></canvas>

        <div class="hud">
          <div class="hud-item">
            <span>SIMULATION</span>
            <strong id="steps">0</strong>
            <small>steps / sec</small>
          </div>

          <div class="hud-item">
            <span>RENDER</span>
            <strong id="fps">0</strong>
            <small>frames / sec</small>
          </div>

          <div class="hud-item">
            <span>FRAME TIME</span>
            <strong id="frame-time">0.00</strong>
            <small>milliseconds</small>
          </div>
        </div>

        <div class="center-message" id="center-message">
          <span class="crosshair">✦</span>
          <strong>READY FOR TAKEOFF</strong>
          <small>Натисніть W або ↑, щоб почати рух</small>
        </div>
      </section>

      <footer class="bottom-bar">
        <div class="controls">
          <span><kbd>W</kbd> / <kbd>↑</kbd> тяга</span>
          <span
            ><kbd>A</kbd> <kbd>D</kbd> / <kbd>←</kbd> <kbd>→</kbd> поворот</span
          >
          <span><kbd>S</kbd> / <kbd>↓</kbd> гальмування</span>
        </div>

        <p>Краї арени з'єднані · Fixed timestep: 60 Hz</p>
      </footer>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
